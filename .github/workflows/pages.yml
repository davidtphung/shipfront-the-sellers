name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock check
        run: |
          set -euo pipefail
          test "$(find . -name '*.html' -not -path './.git/*' | wc -l)" -eq 3
          grep -q 'You Sell. We Ship.' index.html
          grep -q 'eCommerce at Scale' index.html
          grep -q 'David T Phung' index.html
          grep -q 'Fast &amp; Easy Quotes' get-a-quote.html
          grep -q '>Submit<' get-a-quote.html
          grep -q '1933 S. Broadway' contact.html
          grep -q 'mailto:info@myshipfront.com' contact.html
          grep -q '#ff6a00' assets/css/site.css
          grep -q 'M7 9 L12 6 L17 9 L12 12 Z' index.html
          ! grep -rqP '[\x{2013}\x{2014}]' --include='*.html' --include='*.css' --include='*.js' --include='*.md' .
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pages
          rsync -a --delete --exclude '.git/' ./ /tmp/pages/
          cd /tmp/pages
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already matches main"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Publish ${GITHUB_SHA}"
          git push --quiet origin gh-pages
