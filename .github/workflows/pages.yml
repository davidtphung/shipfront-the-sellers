name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock check
        run: |
          set -euo pipefail
          test "$(find . -name '*.html' -not -path './.git/*' | wc -l)" -eq 3
          grep -q 'You Sell. We Ship.' index.html
          grep -q 'eCommerce at Scale' index.html
          grep -q 'David T Phung' index.html
          grep -q 'Fast &amp; Easy Quotes' get-a-quote.html
          grep -q '>Submit<' get-a-quote.html
          grep -q '1933 S. Broadway' contact.html
          grep -q 'mailto:info@myshipfront.com' contact.html
          grep -q '#ff6a00' assets/css/site.css
          ! grep -rqP '[\x{2013}\x{2014}]' --include='*.html' --include='*.css' --include='*.js' --include='*.md' .
      - name: Lockup lock check
        run: |
          set -euo pipefail
          # Cube: regular hex silhouette, three visible face edges meeting at
          # one center vertex, no hidden back-face wire.
          # Wordmark: all caps SHIPFRONT, never title case or lowercase.
          for f in index.html get-a-quote.html contact.html; do
            hex=$(grep -c 'class="hex"' "$f")
            edge=$(grep -c 'class="edge"' "$f")
            test "$edge" -eq $((hex * 2))
            grep -q 'M6.371 9.25 L12 12.5 L17.629 9.25' "$f"
            grep -q 'M12 12.5 L12 19' "$f"
            ! grep -q 'M12 6 L12 13' "$f"
            ! grep -q 'M12 13 L17 16' "$f"
            ! grep -q 'M7 9' "$f"
            test "$(grep -c '<span class="wordmark">SHIPFRONT</span>' "$f")" -eq 2
            ! grep -q '<span class="wordmark">shipfront</span>' "$f"
            ! grep -q '<span class="wordmark">Shipfront</span>' "$f"
          done
          grep -q 'stroke-linecap: butt' assets/css/site.css
          grep -q 'stroke-linejoin: miter' assets/css/site.css
          ! grep -q 'non-scaling-stroke' assets/css/site.css
          # The wordmark rule must stay bold; 400 or 500 is a regression.
          grep -A 5 '^\.wordmark {' assets/css/site.css | grep -q 'font-weight: 700;'
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pages
          rsync -a --delete --exclude '.git/' ./ /tmp/pages/
          cd /tmp/pages
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already matches main"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Publish ${GITHUB_SHA}"
          git push --quiet origin gh-pages
